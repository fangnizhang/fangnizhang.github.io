title: MOVE Lab
name: Dr. Fangni Zhang
description: Mobility Optimization for Value and Efficiency at The University of Hong Kong
url: "https://fangnizhang.github.io"
baseurl: ""
repository: fangnizhang/fangnizhang.github.io
lang: en
encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
include: [_pages]
collections:
  sections:
    output: false
  interests:
    output: false
  people:
    output: false
defaults:
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - README.md
  - MIGRATION.md
  - CHECKS.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - start.ps1
  - start.cmd
  - vendor
  - .runtime
  - .bundle
  - .gitignore
  - .gitattributes
  - .jekyll-cache
  - .sass-cache
  - .github
  - LICENSE
  - source-images
