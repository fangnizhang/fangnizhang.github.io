 <rect x="440" y="81" width="76" height="51" rx="6" fill="#fff0d4" stroke="#d6a039"/><text x="478" y="95"><tspan x="478">Identify</tspan><tspan x="478" dy="14">important</tspan><tspan x="478" dy="14">features</tspan></text>
