title: MOVE Lab @ HKU
name: Dr. Fangni Zhang
description: MOVE Lab (Mobility Optimization for Value and Efficiency) at The University of Hong Kong (HKU), led by Dr. Fangni Zhang, Department of Data and Systems Engineering.
url: "https://fangnizhang.github.io"
baseurl: ""
repository: fangnizhang/fangnizhang.github.io
# Google Search Console > URL-prefix property > "HTML tag": paste only the content="..." value
google_site_verification: ""
lang: en
encoding: utf-8
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
include: [_pages]
collections:
  sections:
    output: false
  interests:
    output: false
  people:
    output: false
defaults:
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - README.md
  - MIGRATION.md
  - CHECKS.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - start.ps1
  - start.cmd
  - vendor
  - .runtime
  - .bundle
  - .gitignore
  - .gitattributes
  - .jekyll-cache
  - .sass-cache
  - .github
  - LICENSE
  - source-images
