<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b28">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | escape }} | {{ site.name | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="page-{{ page.nav }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><div class="container header-inner">
    <a class="site-signature" href="{{ '/' | relative_url }}" aria-label="MOVE Lab — Home"><span>M</span><small>MOVE Lab · HKU</small></a>
    <nav class="desktop-nav" aria-label="Main navigation">{% include navigation.html %}</nav>
    <details class="mobile-nav"><summary>Menu <span aria-hidden="true">☰</span></summary><nav aria-label="Mobile navigation">{% include navigation.html %}</nav></details>
  </div></header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="container footer-inner"><div><strong>MOVE Lab</strong><p>Mobility Optimization for Value and Efficiency<br>The University of Hong Kong</p></div><div class="footer-links"><a href="https://www.dase.hku.hk/people/f-n-zhang">HKU profile ↗</a><a href="https://scholar.google.com/citations?user=pqcRnPcAAAAJ&amp;hl=en">Google Scholar ↗</a><a href="https://github.com/fangnizhang">GitHub ↗</a></div><span class="copyright">© {{ site.time | date: '%Y' }} MOVE Lab</span></div></footer>
</body>
</html>
